button { width: 100%; margin-top: 20px; padding: 12px; background: #114d5d; color: #fff; border: none; border-radius: 6px; font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer; }

<body>
<div class="card">
  <div class="logo-row">
    <div class="logo"></div>
    <div class="brand">FOREST ENERGY <small>O&M Maintenance Dashboard</small></div>
  </div>
  <h2>Sign in</h2>
  <label for="email">Email address</label>
  <input type="email" id="email" placeholder="you@forestenergy.co.za" autocomplete="username">
  <label for="password">Password</label>
  <input type="password" id="password" placeholder="Your password" autocomplete="current-password">
  <button id="btnLogin">Sign in</button>
  <div class="error" id="errMsg"></div>
</div>
<script>
const TOKEN_KEY = 'fe_om_token';

async function login() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const err = document.getElementById('errMsg');
  err.style.display = 'none';
  if (!email || !password) { err.textContent = 'Email and password required.'; err.style.display = 'block'; return; }
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok) { err.textContent = data.error || 'Login failed.'; err.style.display = 'block'; return; }
    localStorage.setItem(TOKEN_KEY, data.token);
    window.location.href = '/';
  } catch(e) {
    err.textContent = 'Network error. Please try again.';
    err.style.display = 'block';
  }
}

document.getElementById('btnLogin').addEventListener('click', login);
document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

// If already logged in, redirect
if (localStorage.getItem(TOKEN_KEY)) window.location.href = '/';
</script>
